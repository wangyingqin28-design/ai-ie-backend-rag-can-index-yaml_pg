  # 2026-06-12 09:52:34 修改：指定 dense 向量名；作用：对齐 LlamaIndex 默认 dense_vector_name；理由：别人默认查询 text-dense。
  dense_vector_name: text-dense
  # 2026-06-12 09:52:34 修改：指定 sparse 向量名；作用：对齐 LlamaIndex 默认 sparse_vector_name；理由：别人默认查询 text-sparse-new。
